[project]
name = "pyreplab"
version = "0.1.0"
description = "Persistent Python REPL for LLM CLI tools"
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["pyreplab"]
script-files = ["pyreplab"]
